# Core stack: Nginx Proxy Manager
# Tworzy wspólną sieć "proxy" używaną przez wszystkie usługi
#
# Uruchomienie:
#   docker compose up -d
#
# Dostęp do NPM admin UI:
#   http://<ip-maszyny>:81
#   domyślne dane: admin@example.com / changeme

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "81:81"       # Admin UI (dostępne przez Tailscale)
    volumes:
      - ./data/nginx-proxy-manager/data:/data
      - ./data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    driver: bridge
