# Portainer - webowe GUI do zarządzania kontenerami Docker
#
# Uruchomienie:
#   docker compose up -d
#
# Dostęp:
#   http://portainer.home.local  (przez NPM)
#   lub bezpośrednio: http://192.168.10.10:9000

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"   # HTTP UI (opcjonalny port bezpośredni)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/portainer:/data
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
