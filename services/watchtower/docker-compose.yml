# Watchtower - automatyczne aktualizacje obrazów Docker
#
# Monitoruje uruchomione kontenery i aktualizuje je gdy pojawi się nowy obraz.
# Domyślnie sprawdza o 3:00 w nocy (konfiguracja w .env)
#
# Uruchomienie:
#   docker compose up -d

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_CLEANUP: "true"          # usuwa stare obrazy po aktualizacji
      WATCHTOWER_INCLUDE_STOPPED: "false" # aktualizuje tylko działające kontenery
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      # Opcjonalne powiadomienia - odkomentuj i uzupełnij dla np. Gotify:
      # WATCHTOWER_NOTIFICATION_URL: "gotify://gotify.home.local/token"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
