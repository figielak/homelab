# Gotify - self-hosted serwer powiadomień push
#
# Przed uruchomieniem:
#   1. Skopiuj .env.example do .env i ustaw GOTIFY_DEFAULTUSER_PASS
#
# Uruchomienie:
#   docker compose up -d
#
# Dostęp:
#   http://gotify.home.local  (przez NPM → gotify:80)
#
# Domyślne dane logowania:
#   login: admin
#   hasło: ustaw w .env (GOTIFY_DEFAULTUSER_PASS)

services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
    volumes:
      - ../../data/gotify:/app/data
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
