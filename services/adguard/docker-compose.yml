# AdGuard Home - lokalny DNS + blokowanie reklam
#
# Po uruchomieniu dokończ konfigurację przez wizard:
#   http://<ip-maszyny>:3000
#
# Wizard ustawi port 53 (DNS) i 80/443 (panel).
# Panel po konfiguracji będzie dostępny na porcie 3001 (żeby nie kolidować z NPM).
#
# Uruchomienie:
#   docker compose up -d
#
# WAŻNE: po uruchomieniu ustaw w routerze DNS na IP tej maszyny

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"     # DNS
      - "53:53/udp"     # DNS
      - "3000:3000"     # wizard (tylko przy pierwszym uruchomieniu)
      - "3001:3001"     # panel admin (po konfiguracji wizarda)
    volumes:
      - ../../data/adguard/work:/opt/adguardhome/work
      - ../../data/adguard/conf:/opt/adguardhome/conf
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
