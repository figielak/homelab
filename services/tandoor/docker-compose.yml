# Tandoor Recipes - zarządzanie przepisami kulinarnymi
#
# Przed uruchomieniem:
#   1. Skopiuj .env.example do .env i ustaw SECRET_KEY oraz POSTGRES_PASSWORD
#   2. Wygeneruj SECRET_KEY: openssl rand -hex 32
#
# Uruchomienie:
#   docker compose up -d
#
# Dostęp:
#   http://tandoor.home.local  (przez NPM → tandoor_nginx:80)

services:
  tandoor_nginx:
    image: nginx:alpine
    container_name: tandoor_nginx
    restart: unless-stopped
    depends_on:
      - tandoor
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../data/tandoor/static:/opt/recipes/staticfiles:ro
      - ../../data/tandoor/media:/opt/recipes/mediafiles:ro
    networks:
      - proxy
      - internal

  tandoor:
    image: vabene1111/recipes:latest
    container_name: tandoor
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SECRET_KEY: ${TANDOOR_SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      TIMEZONE: ${TZ}
      GUNICORN_MEDIA: "0"
    volumes:
      - ../../data/tandoor/static:/opt/recipes/staticfiles
      - ../../data/tandoor/media:/opt/recipes/mediafiles
    networks:
      - internal

  db:
    image: postgres:16
    container_name: tandoor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../../data/tandoor/db:/var/lib/postgresql/data
    networks:
      - internal

networks:
  proxy:
    name: proxy
    external: true
  internal:
    name: tandoor_internal
    internal: true
