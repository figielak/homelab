services:
  # Hub: panel WWW i baza metryk (PocketBase/SQLite). Za Caddy, bez portow.
  beszel:
    image: henrygd/beszel:0.20.0
    container_name: beszel
    restart: unless-stopped

    mem_limit: 128m

    environment:
      APP_URL: https://beszel.home.figielak.dev
      TZ: Europe/Warsaw

    volumes:
      - ${DATA_ROOT}/beszel/hub:/beszel_data
      # Hub laczy sie z lokalnym agentem przez unix socket, nie przez siec.
      # W UI jako "Host / IP" systemu podajesz: /beszel_socket/beszel.sock
      - ${DATA_ROOT}/beszel/socket:/beszel_socket

    healthcheck:
      # Obraz jest FROM scratch — nie ma w nim shella, wget ani curl.
      # Binarka huba ma wbudowana podkomende health.
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - proxy

  # Agent: zbiera metryki hosta i kontenerow.
  beszel-agent:
    image: henrygd/beszel-agent:0.20.0
    container_name: beszel-agent
    restart: unless-stopped

    # Wyjatek od zasady "bez trybu host": agent w sieci bridge widzialby
    # tylko wlasny interfejs kontenera, a nie wlan0 / tailscale0 hosta.
    # Nie publikuje zadnego portu — LISTEN to unix socket, nie TCP.
    network_mode: host

    mem_limit: 64m

    environment:
      LISTEN: /beszel_socket/beszel.sock
      # Klucz publiczny huba (UI: Add system). Nie jest tajny, ale jest
      # unikalny dla instalacji, wiec trzymamy go w .env, nie w repo.
      KEY: ${BESZEL_AGENT_KEY}
      # Zamiast docker.sock — proxy przepuszczajace tylko odczyt.
      # Montaz docker.sock (nawet :ro) to root na hoscie.
      DOCKER_HOST: tcp://127.0.0.1:2375

    volumes:
      - ${DATA_ROOT}/beszel/socket:/beszel_socket

    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      - beszel-socket-proxy

  # Jedyny kontener z dostepem do docker.sock. Przepuszcza wylacznie GET
  # na endpointy, ktorych uzywa agent 0.20.0 (sprawdzone w agent/docker.go):
  # /containers/json, /containers/{id}/json, /containers/{id}/stats,
  # /version, /info. POST=0 — nic nie da sie uruchomic ani zatrzymac.
  beszel-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls98
    container_name: beszel-socket-proxy
    restart: unless-stopped

    mem_limit: 64m

    # Tylko localhost — agent jest w trybie host, wiec nie dosiegnie
    # proxy po nazwie kontenera. Z sieci LAN ani z tailnetu niedostepne.
    ports:
      - "127.0.0.1:2375:2375"

    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      POST: 0
      # Logi kontenerow moga zawierac sekrety — podglad logow w UI Beszela
      # swiadomie nie dziala.
      ALLOW_LOGS: 0
      EVENTS: 0
      TZ: Europe/Warsaw

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    read_only: true
    tmpfs:
      - /run

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/version || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
