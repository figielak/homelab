services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command: 
    # --- API & Dashboard ---
    - --api.insecure=false    # dashboard available only via HTTPS
    - --api.dashboard=true

    # --- Docker Provider ---
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=proxy

    # --- Entry Points ---
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https

    # --- TLS / Let's Encrypt ---
    - --certificatesresolvers.le.acme.email=krystian.figiela@proton.me
    - --certificatesresolvers.le.acme.storage=/certs/acme.json
    - --certificatesresolvers.le.acme.dnschallenge=true
    - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare

    # --- Logging ---
    - --log.level=INFO
    - --accesslog=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/homelab-data/traefik/certs:/certs
      - ./config:/config
    
    env_file:
      - ../.env
      - ../../.env.global

    networks:
      - proxy
      - internal
      - monitoring

    labels:
      - "traefik.enable=true"
      # Dashboard Traefika dostępny przez jego własny routing
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Middleware: basic auth na dashboard
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

networks:
  proxy:
    external: true
  internal:
    external: true
  monitoring:
    external: true