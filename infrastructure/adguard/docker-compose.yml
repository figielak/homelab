services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    networks:
      - proxy
      - internal

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls.certresolver=letsencrypt"
      - "traefik.http.services.adguard.loadbalancer.server.port=9000"
      # Dodatkowa ochrona — dostępny tylko przez Tailscale IP
      #- "traefik.http.routers.adguard.middlewares=tailscale-only@file"

networks:
  proxy:
    external: true
  internal:
    external: true
